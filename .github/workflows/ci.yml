name: EngineeringOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governed structure
        run: python3 eng.py validate
      - name: Check Python syntax
        run: python3 -m compileall -q engineering_os tests
      - name: Run deterministic test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace errors
        run: git diff --check
